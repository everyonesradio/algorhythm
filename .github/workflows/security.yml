name: security

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (pull request commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2 \
            git --log-opts="--no-merges origin/${BASE_REF}..HEAD" --redact --exit-code 1 /repo
      - name: gitleaks (full history, report-only)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2 \
            git --redact --exit-code 1 /repo

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Report-only: becomes blocking once the existing advisory backlog is clear.
      - name: npm audit (production deps)
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev
